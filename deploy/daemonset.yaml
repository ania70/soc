apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubeshield-probe
  namespace: kube-system
  labels:
    app: kubeshield-probe
spec:
  selector:
    matchLabels:
      app: kubeshield-probe
  template:
    metadata:
      labels:
        app: kubeshield-probe
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: probe
          image: kubeshield/probe:0.1
          securityContext:
            privileged: true
          env:
            - name: DASHBOARD_URL
              value: "http://kubeshield-dashboard.default.svc.cluster.local:8001"
            - name: PROBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kubeshield-probe-key
                  key: probe-api-key
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: proc
              mountPath: /proc
              readOnly: true
      volumes:
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: proc
          hostPath:
            path: /proc
            type: Directory
