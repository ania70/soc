apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubeshield.fullname" . }}
  labels:
    {{- include "kubeshield.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "kubeshield.selectorLabels" . | nindent 4 }}
